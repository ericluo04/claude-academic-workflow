<script>
// Dark lab runtime. Five jobs, all on the live deck and none at build time:
//
// 1. Backup nesting. A slide whose heading carries {.backup} becomes a vertical
//    child of the nearest slide above it that is not a backup, so it sits one
//    press of the down arrow under the slide it supports and never in the
//    lecture's path. This runs before reveal builds its index; on a deck where
//    reveal is already up it re-syncs.
// 2. The breadcrumb at the bottom left: the number and title of the section the
//    slide belongs to, read off the `.section-break` dividers (stage-slide.lua
//    writes data-section-number on each). Nothing to write per slide.
// 3. The hint at the bottom right: "↓ backup" on a slide with a backup under it,
//    "↑ back" on the backup itself.
// 4. Key remap. Space, PageDown and N advance like the right arrow, and PageUp
//    and P go back like the left arrow, so a clicker never walks into a backup.
// 5. Equation builds. A term written \class{hid bK}{...} inside display math
//    enters on the K-th `.build` element of the slide (an empty
//    [ ]{.fragment .build} marker or any staged block carrying .build). The term
//    that entered on the current press is drawn in teal until the next press.
(function () {
  function nestBackups() {
    var slides = document.querySelector(".reveal .slides");
    if (!slides) return false;
    var moved = false;
    var top = Array.prototype.slice.call(slides.children).filter(function (el) {
      return el.tagName === "SECTION";
    });
    var parent = null;
    top.forEach(function (sec) {
      if (!sec.classList.contains("backup")) { parent = sec; return; }
      if (!parent) return;
      var stack = parent.parentNode === slides && parent.tagName === "SECTION" &&
                  parent.querySelector(":scope > section") ? parent : null;
      if (!stack) {
        stack = document.createElement("section");
        stack.className = "stack lab-stack";
        slides.insertBefore(stack, parent);
        stack.appendChild(parent);
        parent = stack;
      }
      stack.appendChild(sec);
      moved = true;
    });
    return moved;
  }

  var moved = nestBackups();

  function setup() {
    if (moved && window.Reveal && Reveal.sync) Reveal.sync();
    var slides = document.querySelector(".reveal .slides");
    var crumb = document.createElement("div");
    crumb.className = "lab-crumb";
    var hint = document.createElement("div");
    hint.className = "lab-hint";
    slides.appendChild(crumb);
    slides.appendChild(hint);

    // One pass in document order: each slide inherits the last divider above it.
    var label = new Map();
    var current = null;
    Reveal.getSlides().forEach(function (s) {
      var c = s.classList;
      if (c.contains("section-break")) {
        var h = s.querySelector("h1, h2");
        current = {
          n: s.getAttribute("data-section-number") || "",
          t: h ? h.textContent.trim() : ""
        };
        label.set(s, null);
        return;
      }
      if (s.id === "title-slide" || c.contains("closing-slide") ||
          c.contains("references-break") || c.contains("references") ||
          c.contains("appendix-break")) {
        label.set(s, null);
        return;
      }
      label.set(s, current);
    });

    function update() {
      var s = Reveal.getCurrentSlide();
      var idx = Reveal.getIndices();
      var c = label.get(s);
      crumb.textContent = "";
      if (c) {
        var b = document.createElement("b");
        b.textContent = c.n;
        crumb.appendChild(b);
        crumb.appendChild(document.createTextNode(
          (c.n ? "  " : "") + c.t + (idx.v > 0 ? "  ·  backup" : "")));
        crumb.hidden = false;
      } else {
        crumb.hidden = true;
      }
      var r = Reveal.availableRoutes();
      if (r.down) { hint.textContent = "↓ backup"; hint.hidden = false; }
      else if (idx.v > 0) { hint.textContent = "↑ back"; hint.hidden = false; }
      else { hint.hidden = true; }
    }

    function build() {
      var s = Reveal.getCurrentSlide();
      var markers = s.querySelectorAll(".build");
      if (!markers.length) return;
      var step = 0, fresh = 0;
      markers.forEach(function (m, i) {
        var f = m.classList.contains("fragment") ? m : m.closest(".fragment");
        if (!f || f.classList.contains("visible")) {
          step = i + 1;
          if (f && f.classList.contains("current-fragment")) fresh = i + 1;
        }
      });
      for (var k = 1; k <= markers.length; k++) {
        s.querySelectorAll(".b" + k).forEach(function (el) {
          el.classList.toggle("hid", k > step);
          el.classList.toggle("mjx-new", k === fresh);
        });
      }
    }

    function forward(e) { if (e && e.shiftKey) Reveal.left(); else Reveal.right(); }
    Reveal.configure({
      keyboard: {
        32: forward, 34: forward, 78: forward,
        33: function () { Reveal.left(); }, 80: function () { Reveal.left(); }
      }
    });

    Reveal.on("slidechanged", function () { update(); build(); });
    Reveal.on("fragmentshown", build);
    Reveal.on("fragmenthidden", build);
    update();
    build();
    if (window.MathJax && MathJax.Hub) MathJax.Hub.Queue(build);
  }

  if (window.Reveal && Reveal.isReady && Reveal.isReady()) setup();
  else if (window.Reveal) Reveal.on("ready", setup);
})();
</script>
