<!-- Editorial format, header include. Paths resolve against the rendered HTML,
     so the deck directory needs the `fonts/` and `mathjax/` copies from
     slide-tooling/. MathJax is pinned to its own TeX webfonts so glyph metrics do
     not depend on the viewing machine. -->
<script>window.MathJax = { "HTML-CSS": { availableFonts: [], preferredFont: null, webFont: "TeX", scale: 100 } };</script>
<style>
@font-face { font-family: "Schibsted Grotesk"; font-style: normal; font-weight: 400 900; font-display: block;
  src: url("fonts/schibsted-grotesk/schibsted-grotesk-latin-wght-normal.woff2") format("woff2"); }
@font-face { font-family: "Schibsted Grotesk"; font-style: italic; font-weight: 400 900; font-display: block;
  src: url("fonts/schibsted-grotesk/schibsted-grotesk-latin-wght-italic.woff2") format("woff2"); }
</style>
