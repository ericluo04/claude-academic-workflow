# gitleaks configuration for claude-academic-workflow
#
# Inherits the default gitleaks ruleset and adds repo-local allowlists for:
#   - placeholder patterns (e.g. {{TELEGRAM_BOT_TOKEN}}, <uuid>, <chat-id>)
#   - example UUIDs in documentation
#   - the redact-check.py file itself, which contains regex patterns for
#     matching secrets (NOT actual secrets)
#   - personal_config.example.json (placeholders only)
#
# Reference: https://github.com/gitleaks/gitleaks#configuration

[extend]
# Pull in the default gitleaks ruleset (Anthropic, GitHub, AWS, GCP, Slack, etc.)
useDefault = true

[allowlist]
description = "Repo-local allowlist for placeholders and pattern files"

# Files where matches should be ignored entirely. These files contain
# placeholder values, regex patterns, or example data — not real secrets.
paths = [
  '''(^|/)scripts/redact-check\.py$''',
  '''(^|/)\.gitleaks\.toml$''',
  '''(^|/)skills/_config/personal_config\.example\.json$''',
  '''(^|/)config/settings\.example\.json$''',
  '''(^|/)config/settings\.local\.example\.json$''',
  '''(^|/)docs/.*\.md$''',
  '''(^|/)SETUP\.md$''',
  '''(^|/)ATTRIBUTION\.md$''',
  '''(^|/)orchestration/README\.md$''',
]

# Patterns that look like secrets but are demonstrably placeholders.
# Matches anywhere in the repo.
regexes = [
  # Mustache / curly-brace placeholders
  '''\{\{[A-Z_][A-Z0-9_]*\}\}''',
  # Angle-bracket placeholders ("<uuid>", "<chat-id>", "<your-fork>")
  '''<[a-z][a-z0-9 _-]{1,40}>''',
  # The literal words "placeholder", "example", "your-...-here"
  '''(?i)placeholder|your[-_][a-z]+[-_]here|example[-_](?:token|key|id|secret)''',
  # All-zero or all-X UUIDs (common in docs)
  '''00000000-0000-0000-0000-000000000000''',
  '''[xX]{8}-[xX]{4}-[xX]{4}-[xX]{4}-[xX]{12}''',
]

# Specific commits to ignore (none yet; reserved for future use)
commits = []
